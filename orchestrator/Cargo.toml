[package]
name = "cathedral_arkhe"
version = "28.3.2"
edition = "2021"

[dependencies]
ndarray = "0.15"
nalgebra = "0.32"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.4"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
